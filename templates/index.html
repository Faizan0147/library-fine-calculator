<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Library Fine Calculator</title>
</head>
<body>
  <h1>Library Fine Calculator</h1>
  <form method="post">
    <label for="days">Days overdue (0-20):</label>
    <input type="text" id="days" name="days">
    <button type="submit" id="submit">Calculate</button>
  </form>
  {% if result %}
    <p id="result" class="{{ 'ok' if result.ok else 'error' }}">{{ result.message }}</p>
  {% endif %}
</body>
</html>
